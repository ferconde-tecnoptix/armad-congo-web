<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portería - Armonía Resonante</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121824; color: #fff; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 10px; }
    header h1 { font-size: 1.3rem; color: #38bdf8; }

    .result-card { background: #1e293b; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .status-banner { padding: 14px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
    
    .state-PERMITIDO { background-color: #15803d; color: #ffffff; }
    .state-USADO { background-color: #b45309; color: #ffffff; }
    .state-NO_CONFIRMADO { background-color: #b91c1c; color: #ffffff; }

    .ticket-info { text-align: left; background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 1rem; line-height: 1.6; }
    .ticket-info div { margin-bottom: 8px; }
    .ticket-info strong { color: #38bdf8; }

    .btn-confirm { width: 100%; padding: 16px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 1.15rem; font-weight: bold; cursor: pointer; }
    .loading { text-align: center; padding: 30px; font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Control de Acceso / Portería</h1>
    </header>

    <div id="loading" class="loading">🔍 Consultando estado en tiempo real...</div>

    <div id="result-card" class="result-card" style="display: none;">
      <div id="status-banner" class="status-banner"></div>

      <div class="ticket-info">
        <div><strong>ID Registro:</strong> <span id="info-id"></span></div>
        <div><strong>Titular:</strong> <span id="info-nombre"></span></div>
        <div><strong>Entradas:</strong> <span id="info-boletas"></span> boleta(s)</div>
        <div><strong>Estado Pago:</strong> <span id="info-pago"></span></div>
        <div><strong>Estado Ingreso:</strong> <span id="info-ingreso"></span></div>
        <div id="row-fecha-ingreso" style="display:none;"><strong>Fecha Ingreso:</strong> <span id="info-fecha-ingreso"></span></div>
      </div>

      <button id="btn-confirm-entry" type="button" class="btn-confirm" onclick="confirmEntry()">Confirmar Ingreso</button>
    </div>
  </div>

  <script>
  // 1. REEMPLAZA ESTA URL CON LA DE TU DESPLIEGUE EN GOOGLE APPS SCRIPT
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwh735VkvDwFgj30VFnLJF0tEjop26bjFa-iB-ngu_M0sHXClg1xOnXPN53cAq9FoM6/exec";

  // 2. Extraer el ID de la URL (Ejemplo: Porteria.html?id=AR-001)
  const urlParams = new URLSearchParams(window.location.search);
  const idRegistro = urlParams.get('id');

  let currentRecord = null;

  document.addEventListener("DOMContentLoaded", () => {
    if (idRegistro) {
      verifyCode(idRegistro);
    } else {
      document.getElementById("loading").innerText = "⚠️ No se especificó ningún código de entrada en la URL.";
    }
  });

  function verifyCode(id) {
    document.getElementById("loading").innerText = "🔍 Consultando estado en tiempo real...";
    document.getElementById("loading").style.display = "block";
    document.getElementById("result-card").style.display = "none";

    const fetchUrl = `${GOOGLE_SCRIPT_URL}?action=checkEntryStatus&id=${encodeURIComponent(id)}`;

    fetch(fetchUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error("Respuesta de red no OK");
        }
        return response.json();
      })
      .then(showResult)
      .catch(err => {
        console.error("Error al consultar:", err);
        document.getElementById("loading").innerText = "❌ Error al consultar la base de datos. Revisa la consola o la conexión.";
      });
  }

  function showResult(response) {
    document.getElementById("loading").style.display = "none";
    const card = document.getElementById("result-card");
    const banner = document.getElementById("status-banner");
    const btnConfirm = document.getElementById("btn-confirm-entry");

    if (!response || !response.found) {
      document.getElementById("loading").innerText = "❌ Código no encontrado en la base de datos.";
      document.getElementById("loading").style.display = "block";
      return;
    }

    currentRecord = response;

    document.getElementById("info-id").innerText = response.idRegistro;
    document.getElementById("info-nombre").innerText = response.nombre;
    document.getElementById("info-boletas").innerText = response.cantidad;
    document.getElementById("info-pago").innerText = response.estadoPago;
    document.getElementById("info-ingreso").innerText = response.estadoIngreso;

    if (response.estadoPago !== "CONFIRMADO") {
      banner.innerText = "❌ PAGO NO CONFIRMADO";
      banner.className = "status-banner state-NO_CONFIRMADO";
      btnConfirm.style.display = "none";
      document.getElementById("row-fecha-ingreso").style.display = "none";

    } else if (response.estadoIngreso === "INGRESADO") {
      banner.innerText = "⚠️ QR YA UTILIZADO";
      banner.className = "status-banner state-USADO";
      btnConfirm.style.display = "none";
      document.getElementById("row-fecha-ingreso").style.display = "block";
      document.getElementById("info-fecha-ingreso").innerText = response.fechaIngreso;

    } else {
      banner.innerText = "✅ ACCESO PERMITIDO";
      banner.className = "status-banner state-PERMITIDO";
      btnConfirm.style.display = "block";
      btnConfirm.innerText = `Confirmar Ingreso (${response.cantidad} Entradas)`;
      document.getElementById("row-fecha-ingreso").style.display = "none";
    }

    card.style.display = "block";
  }

  function confirmEntry() {
    if (!currentRecord) return;

    const btnConfirm = document.getElementById("btn-confirm-entry");
    btnConfirm.disabled = true;
    btnConfirm.innerText = "Registrando...";

    const fetchUrl = `${GOOGLE_SCRIPT_URL}?action=setConfirmedEntry&id=${encodeURIComponent(currentRecord.idRegistro)}`;

    fetch(fetchUrl)
      .then(response => response.json())
      .then(response => {
        if (response.success) {
          alert(`✅ Ingreso registrado exitosamente para ${currentRecord.nombre}`);
          location.reload();
        } else {
          alert("Error: " + response.message);
          btnConfirm.disabled = false;
        }
      })
      .catch(err => {
        alert("Error de conexión al registrar ingreso.");
        btnConfirm.disabled = false;
      });
  }
  </script>
</body>
</html>
